<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DynIsland</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="apppick.css">
</head>
<body>
<div id="island" class="mode-line">
  <!-- closed pill: mini art, optional countdown, bars -->
  <div id="closed">
    <div id="cArt"><img id="cArtImg" alt=""><span class="ring"></span></div>
    <span id="cTime"></span>
    <div id="cViz"><span class="dots">···</span><div class="eq"><i></i><i></i><i></i><i></i></div></div>
  </div>
  <!-- track change preview -->
  <div id="peek"><img id="peekArt" alt=""><div class="pt"><b id="peekTitle"></b><span id="peekArtist"></span></div><div class="eq"><i></i><i></i><i></i><i></i></div></div>
  <!-- notification toast -->
  <div id="note-toast"><span id="noteToastText"></span><div id="ntRich"><img id="ntIcon" alt="" hidden><div class="ntText"><div class="ntTop" id="ntApp"></div><div id="ntTitle"></div><div id="ntBody"></div></div></div></div>

  <div id="full">
    <header>
      <nav id="navL">
        <button data-page="home" title=""><svg viewBox="0 0 24 24"><path d="M3.500 11 12 3.500l8.500 7.500v8.500a1 1 0 0 1-1 1H15v-6H9v6H4.500a1 1 0 0 1-1-1z"/></svg></button>
        <div id="volGrp">
          <button id="volBtn"><svg id="icVol" viewBox="0 0 24 24"><path d="M4 9.500v5h3.500l5 4v-13l-5 4zM16 9a4.500 4.500 0 0 1 0 6M18.500 6.500a8 8 0 0 1 0 11"/></svg><svg id="icMute" viewBox="0 0 24 24" hidden><path d="M4 9.500v5h3.500l5 4v-13l-5 4zM16.500 9.500l5 5M21.500 9.500l-5 5"/></svg></button>
          <div id="volSlide"><input id="volRange" type="range" min="0" max="100" value="50"></div>
        </div>
        <button data-page="shelf" title=""><svg viewBox="0 0 24 24"><path d="M3.500 13.500h4.500l1.500 2.500h5l1.500-2.500h4.500v5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2zM5.500 13.500l1.800-7.500a1 1 0 0 1 1-.8h7.400a1 1 0 0 1 1 .8l1.800 7.500"/></svg><b id="shelfBadge" hidden></b></button>
        <button data-page="clip" title=""><svg viewBox="0 0 24 24"><rect x="5" y="4.500" width="14" height="16.500" rx="2"/><path d="M9 4.500V3.500h6v1M9 10h6M9 14h6"/></svg></button>
      </nav>
      <nav id="navR">
        <button id="clearShelf" class="chip" hidden></button>
        <button data-page="sys"><i class="gl">&#xE9D9;</i></button>
        <button data-page="trans"><i class="gl">&#xF2B7;</i></button>
        <button data-page="timer"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.500" r="7"/><path d="M12 9.500v4l2.500 1.500M9.500 3h5"/></svg></button>
        <button data-page="notif"><svg viewBox="0 0 24 24"><path d="M6 17v-6a6 6 0 0 1 12 0v6l1.500 2h-15zM10 21.500h4"/></svg><i id="bellDot" hidden></i></button>
        <button id="gearBtn"><svg viewBox="0 0 24 24"><path d="M12 8.500a3.500 3.500 0 1 0 0 7 3.500 3.500 0 0 0 0-7zM19.400 13.500a7.500 7.500 0 0 0 0-3l1.800-1.400-1.800-3.100-2.200.8a7.500 7.500 0 0 0-2.600-1.500L14.200 2.500H9.800L9.400 5.300a7.500 7.500 0 0 0-2.600 1.500l-2.200-.8L2.800 9.100 4.600 10.500a7.500 7.500 0 0 0 0 3l-1.800 1.400 1.800 3.100 2.200-.8a7.500 7.500 0 0 0 2.600 1.500l.4 2.800h4.400l.4-2.800a7.500 7.500 0 0 0 2.600-1.500l2.200.8 1.800-3.100z"/></svg></button>
      </nav>
    </header>

    <div id="pages">
      <section id="home" class="page">
        <div id="slides">
          <div class="slide">
            <div class="media">
              <div class="art"><img id="art" alt=""><div class="ph"></div><span id="srcBadge"></span></div>
              <div class="meta">
                <div class="row1"><div id="title" class="title"></div><button id="lyBtn"><i class="gl">&#xEC4F;</i></button></div>
                <div id="artist" class="artist"></div>
                <div id="lyBox" hidden><div id="lyList" class="lyList"></div><button id="lyTr" class="chip" data-t="tr_lyrics" hidden></button><span id="lySrc"></span></div>
                <canvas id="viz" width="240" height="22"></canvas>
                <div class="bar"><span id="tPos">0:00</span><div id="seek"><div id="fill"></div><div id="knob"></div></div><span id="tEnd">0:00</span></div>
                <div class="ctrl">
                  <button id="bShuffle"><svg viewBox="0 0 24 24"><path d="M3 7h3c5 0 6 10 11 10h3M3 17h3c1.500 0 2.600-.7 3.600-1.800M20 7h-3c-1.500 0-2.600.7-3.600 1.800M17 4l3 3-3 3M17 14l3 3-3 3"/></svg></button>
                  <button id="bPrev"><svg viewBox="0 0 24 24"><path d="M6.500 5v14M18.500 5.500v13L9 12z"/></svg></button>
                  <button id="bPlay" class="big"><svg id="icPlay" viewBox="0 0 24 24"><path d="M7.500 4.500v15L19.500 12z"/></svg><svg id="icPause" viewBox="0 0 24 24" hidden><path d="M7 5v14M17 5v14"/></svg></button>
                  <button id="bNext"><svg viewBox="0 0 24 24"><path d="M17.500 5v14M5.500 5.500v13L15 12z"/></svg></button>
                  <button id="bRepeat"><svg viewBox="0 0 24 24"><path d="M4 11V9a3 3 0 0 1 3-3h12M16 3l3 3-3 3M20 13v2a3 3 0 0 1-3 3H5M8 21l-3-3 3-3"/></svg><u id="repOne" hidden>1</u></button>
                </div>
              </div>
            </div>
            <div class="side">
              <div class="mrow"><div id="month" class="month"></div><div id="wx" class="wx" hidden><span id="wxIcon"></span><b id="wxTemp"></b></div></div>
              <div id="cal" class="cal"></div>
              <div id="clock" class="clock"></div>
              <div id="date" class="date"></div>
            </div>
          </div>
          <div class="slide notes">
            <div class="nhead"><b data-t="notes"></b><span id="noteCount"></span></div>
            <textarea id="note" spellcheck="false"></textarea>
          </div>
        </div>
        <div id="pdots"><i class="on"></i><i></i></div>
      </section>

      <section id="shelf" class="page">
        <div id="quick" class="quick"></div>
        <div id="files" class="files"></div>
      </section>

      <section id="clip" class="page">
        <div class="clipHead"><input id="clipQ" spellcheck="false"><div id="clipFilters" class="trLangs"></div><button id="clearClip" class="chip" data-t="clear"></button></div>
        <div id="clipList" class="clips"></div>
        <div id="clipPrev" hidden>
          <div id="cpBody"></div>
          <div class="cpBar"><span id="cpMeta"></span><div id="cpActions"></div></div>
        </div>
      </section>

      <section id="timer" class="page">
        <div class="tabs"><button id="tabTimer" class="on" data-t="timer"></button><button id="tabSw" data-t="stopwatch"></button></div>
        <div class="tbody">
          <div id="tBig" class="tbig">5:00</div>
          <div id="presets" class="presets"><button data-m="1">1</button><button data-m="5">5</button><button data-m="10">10</button><button data-m="25">25</button><button data-m="45">45</button></div>
          <div class="tctl"><button id="tGo" class="chip hot"></button><button id="tReset" class="chip" data-t="reset"></button></div>
        </div>
      </section>

      <section id="notif" class="page">
        <div class="phead"><b data-t="notifs"></b><button id="clearNotif" class="chip" data-t="clear"></button></div>
        <div id="notifList" class="clips col"></div>
      </section>

      <section id="sys" class="page">
        <div id="sysGrid" class="sysGrid"></div>
      </section>

      <section id="trans" class="page">
        <div class="trLangs" id="trLangs"></div>
        <div class="trBody">
          <textarea id="trIn" spellcheck="false"></textarea>
          <div class="trRes"><div id="trOut"></div><button id="trCopy" class="chip" data-t="tr_copy" hidden></button></div>
        </div>
      </section>
    </div>
  </div>
  <div id="toast"></div>
</div>
<script src="i18n.js"></script>
<script src="apppick.js"></script>
<script src="app.js"></script>
</body>
</html>
