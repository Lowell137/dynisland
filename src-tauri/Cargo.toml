[package]
name = "dynisland"
version = "0.1.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
drag = "2"
png = "0.17"
base64 = "0.22"
sysinfo = "0.32"
tauri-plugin-global-shortcut = "2"
ureq = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_DataExchange", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_Controls"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
